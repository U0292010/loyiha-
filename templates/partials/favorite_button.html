{% if request.user.is_authenticated %}
  <form class="favorite-form" method="post" action="{% url 'favorites:toggle' property.slug %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button class="favorite-button {% if property.is_favorited %}is-favorited{% endif %}" type="submit" aria-label="{% if property.is_favorited %}Sevimlilardan olib tashlash{% else %}Sevimlilarga saqlash{% endif %}" aria-pressed="{{ property.is_favorited|yesno:'true,false' }}">
      <span aria-hidden="true">{% if property.is_favorited %}♥{% else %}♡{% endif %}</span>
    </button>
  </form>
{% else %}
  <a class="favorite-button" href="{% url 'accounts:login' %}?next={{ request.get_full_path|urlencode }}" aria-label="Sevimlilarga saqlash uchun kiring">
    <span aria-hidden="true">♡</span>
  </a>
{% endif %}
